# Cargo.toml

[package]
name = "SeniorSystem"
version = "1.3.1"
edition = "2021"
# A linha abaixo é opcional, mas ajuda a definir qual programa rodar com o comando "cargo run" simples.
default-run = "senior-system-gui"

# Seção que define os dois programas (binários) que nosso projeto gera
[[bin]]
name = "senior-system-gui"
path = "src/main.rs"

[[bin]]
name = "senior-system-server"
path = "src/server.rs"

[dependencies]
# Dependências existentes para o GUI
eframe = "0.32.3"
mysql = "*"
bcrypt = "0.15"   # Ajustei para uma versão mais recente compatível.
once_cell = "1.19" # Ajustei para uma versão mais recente compatível.
image = { version = "0.24", features = ["png"] }
dotenvy = "0.15"
thiserror = "1.0"

# Nova dependência para o Cliente (GUI) fazer requisições HTTP
# A feature "blocking" é importante para requisições simples na UI sem usar async/await complexo.
reqwest = { version = "0.12", features = ["json", "blocking"] }

# Novas dependências para o Servidor (Backend)
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5.0", features = ["cors"] }