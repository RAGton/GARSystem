[package]
name = "senior_system"
version = "1.9.0"
edition = "2021"
# Migração egui → Next.js concluída (P2.7). Backend agora é API-only (Axum).
# GUI desktop removida em 2026-09-07 — cobertura Next.js em /frontend.

# Seção que define os programas (binários) que nosso projeto gera
[[bin]]
name = "senior-system-server"
path = "src/server.rs"

[[bin]]
name = "senior-system-admin"
path = "src/bin/admin_cli.rs"

[[bin]]
name = "audit-rbac-achado1"
path = "src/bin/audit_rbac_achado1.rs"

[lib]
name = "senior_system"
path = "src/lib.rs"

# ==========================================================
# Dependências
# ==========================================================
[dependencies]

# --- Cliente HTTP (usado por bin/admin_cli para chamadas internas) ---
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
# image: processamento server-side (compressão JPEG de anexos via arquivos::service)
image = { version = "0.25", default-features = false, features = ["jpeg"] }
threadpool = "1.8"
num_cpus = "1.17"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }

# --- Dependências para o Servidor (Backend) ---
# Usamos Axum, o framework web moderno que integra com Tokio
axum = "0.8.6"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5.0", features = ["cors"] }

# --- Dependências Compartilhadas (GUI, Servidor e Biblioteca) ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.17"
once_cell = "1.19"
dotenvy = "0.15"
jsonwebtoken = "9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.10", features = ["v4"] }
rand = "0.8"

# --- Dependências de Banco de Dados e Criptografia ---
# Versão fixada para estabilidade
mysql = "26.0.1"
bcrypt = "0.17.1"
genpdf = "0.2"
open = "5.3.2"
printpdf = "0.8.2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }

# --- Features ---
# `integration-tests` habilita os testes marcados com #[ignore] que
# requerem MySQL real. Por padrão estão desabilitados.
[features]
default = []
integration-tests = []